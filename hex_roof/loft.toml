[package]
name    = "hex_roof"
version = "0.1.3"
loft    = ">=0.8"

# 0.1.1 is a WARNING-ONLY fix and changes no behaviour: `roof_hip`'s fill loop
# named a counter it never read, which a newer loft diagnoses as `never-read`
# and which fails this package -- and `hex_draw` and `hex_fit`, which reach it
# as a dependency -- under the unified library-ci's LOFT_DENY_WARNINGS=1.
#
# ⚠ It is released rather than left on main because the PUBLISHED 0.1.0 tarball
# carries the warning, so a registry consumer running its own CI under
# LOFT_DENY_WARNINGS=1 hits it from this library's source and cannot fix it.
# That is the whole reason for the version: nothing about the API or the data
# moved, and both pins say so.
api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads
[library]
entry = "src/hex_roof.loft"

# REGISTRY DEPENDENCIES (added to the index entry at publish time, NOT declared here): hex_field, hex_way
# Declared as `[dependencies] x = ">=0.1"` they break `--lib` multi-library consumption -- loft
# resolves the dep from the registry instead of the --lib path. Install reads deps from the
# registry INDEX, not this file (loft src/install.rs resolve_recursive uses version.deps), so the
# deps live in the index entry. See hexbody plans/lib-split.
