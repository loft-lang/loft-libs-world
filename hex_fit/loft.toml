[package]
name    = "hex_fit"
version = "0.1.0"
loft    = ">=0.8"

[library]
entry = "src/hex_fit.loft"

[dependencies]
hex_field = ">=0.1"
hex_grid  = ">=0.1"
hex_form  = ">=0.1"
hex_shape = ">=0.1"
hex_draw  = ">=0.1"
hex_recover = ">=0.1"

# Registry-style version constraints, NOT path deps: a path dep loaded transitively does
# not resolve its own path deps (see plans/lib-split in hexbody), so publishing bottom-up
# with `>=` constraints is the form that installs. Resolved by `--lib` locally, by the
# registry once published.
