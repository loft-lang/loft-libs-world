[package]
name    = "hex_body"
version = "0.1.0"
loft    = ">=0.8"

api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads
[library]
entry = "src/hex_body.loft"

# No dependencies: the body is pure continuous-space kinematics -- bones, joints, poses and
# collision proxies -- with NO lattice dependency. It is the first library from the hexbody
# workshop that is NOT part of the hex_* family, exactly because it does not use hex code
# (the naming rule: hex_ iff it depends on the lattice). See hexbody plans/m1-moving-body.
