[package]
name    = "hex_ground"
version = "0.1.1"
loft    = ">=2026.10.0"
repository = "loft-libs-world"
description = "The ground of one place: a height and a surface kind per cell, shaped into terraces, a hill, a seat, a cut and cliffs"
categories  = ["geometry", "world"]

api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads
[library]
entry = "src/hex_ground.loft"

# The registry dependencies, declared here because this package has no earlier index entry to
# carry them forward from (the publish routine reads them from the manifest or from the
# previous entry).  A sibling handed by `--lib` is still the one used: a local library wins
# over the registry's.
[dependencies]
hex_field = ">=0.1"
hex_draw  = ">=0.1"
hex_place = ">=0.1"
