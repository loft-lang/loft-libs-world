[package]
name    = "hex_form"
version = "0.1.1"
loft    = ">=0.8"

api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads
[library]
entry = "src/hex_form.loft"

# REGISTRY DEPENDENCIES (added to the index entry at publish time, NOT declared here): hex_field, hex_grid
# Declared as `[dependencies] x = ">=0.1"` they break `--lib` multi-library consumption -- loft
# resolves the dep from the registry instead of the --lib path. Install reads deps from the
# registry INDEX, not this file (loft src/install.rs resolve_recursive uses version.deps), so the
# deps live in the index entry. See hexbody plans/lib-split.
