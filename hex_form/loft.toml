

# REGISTRY DEPENDENCIES (for the index entry, NOT declared here): hex_field, hex_grid
# Declared as `[dependencies] x = ">=0.1"` they break `--lib` multi-library consumption
# (loft attempts registry resolution of the dep instead of finding it on the --lib path);
# and install reads deps from the registry INDEX, not this file (loft src/install.rs
# resolve_recursive uses version.deps). So the deps belong in the index entry, added at
# publish time -- this comment is their source of truth until then.
