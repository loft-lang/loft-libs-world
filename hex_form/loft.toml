[package]
name    = "hex_form"
version = "0.1.2"
loft    = ">=0.8"

api_compatible_with  = "0.1.2"   # DECLARED BREAK: not a drop-in for 0.1.0 — see below.
                                 # This package's own API surface is a pure superset; the
                                 # floor moves because a drop-in must also read what the
                                 # older release stored, and that is what changed.
data_compatible_with = "0.1.2"   # DECLARED BREAK: hex_field's `EdgeSet` gained a field, so
                                 # `EdgeSet` / `HexDoc` / `Stencil` reshape through the
                                 # dependency and a store written by 0.1.0 is read at the
                                 # wrong offsets.
[library]
entry = "src/hex_form.loft"

# REGISTRY DEPENDENCIES (added to the index entry at publish time, NOT declared here): hex_field, hex_grid
# Declared as `[dependencies] x = ">=0.1"` they break `--lib` multi-library consumption -- loft
# resolves the dep from the registry instead of the --lib path. Install reads deps from the
# registry INDEX, not this file (loft src/install.rs resolve_recursive uses version.deps), so the
# deps live in the index entry. See hexbody plans/lib-split.
